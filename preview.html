<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prévisualisation mobile — Silencio</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #111118;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 20px 60px;
      font-family: 'Jost', sans-serif;
    }

    /* ── Header bar ── */
    .preview-header {
      width: 100%;
      max-width: 500px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
    }
    .preview-brand {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      font-weight: 300;
      letter-spacing: 0.2em;
      color: #c9a96e;
    }
    .preview-brand span { font-style: italic; }
    .preview-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
    }

    /* ── Phone frame ── */
    .phone-wrap {
      position: relative;
      width: 375px;
      /* tall enough for the notch + screen + chin */
    }

    /* outer shell */
    .phone-shell {
      position: relative;
      width: 375px;
      background: #1a1a1f;
      border-radius: 52px;
      padding: 14px;
      box-shadow:
        0 0 0 1.5px #3a3a42,
        0 0 0 3px #252528,
        0 40px 100px rgba(0,0,0,0.7),
        inset 0 0 0 1px #2c2c32;
    }

    /* inner bezel */
    .phone-bezel {
      background: #000;
      border-radius: 42px;
      overflow: hidden;
      position: relative;
    }

    /* status bar */
    .phone-status {
      height: 44px;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px 0;
      position: relative;
      z-index: 10;
    }
    .status-time {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.01em;
    }
    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-icons svg { fill: #fff; }

    /* dynamic island */
    .dynamic-island {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 34px;
      background: #000;
      border-radius: 20px;
      z-index: 20;
    }

    /* screen / iframe */
    .phone-screen {
      width: 100%;
      height: 780px;
      border: none;
      display: block;
      background: #fff;
      /* We scale the 390px-wide page into 347px */
      transform-origin: top left;
    }

    /* home indicator */
    .home-bar {
      height: 34px;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .home-indicator {
      width: 130px;
      height: 5px;
      background: rgba(255,255,255,0.35);
      border-radius: 3px;
    }

    /* side buttons */
    .btn-side {
      position: absolute;
      background: #2a2a30;
      border-radius: 3px;
      box-shadow: inset 0 0 0 1px #3a3a42;
    }
    .btn-power {
      right: -4px;
      top: 110px;
      width: 4px;
      height: 72px;
    }
    .btn-vol-up {
      left: -4px;
      top: 100px;
      width: 4px;
      height: 42px;
    }
    .btn-vol-down {
      left: -4px;
      top: 154px;
      width: 4px;
      height: 42px;
    }
    .btn-silent {
      left: -4px;
      top: 72px;
      width: 4px;
      height: 22px;
    }

    /* ── Hint text ── */
    .hint {
      margin-top: 28px;
      font-size: 12px;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.25);
      text-align: center;
    }

    /* ── Gold rule ── */
    .gold-line {
      width: 40px;
      height: 1px;
      background: #c9a96e;
      margin: 16px auto 0;
      opacity: 0.5;
    }
  </style>
</head>
<body>

  <div class="preview-header">
    <div class="preview-brand">LA <span>NOTE</span></div>
    <div class="preview-label">Aperçu mobile — Silencio</div>
  </div>

  <div class="phone-wrap">

    <!-- Side buttons -->
    <div class="btn-side btn-silent"></div>
    <div class="btn-side btn-vol-up"></div>
    <div class="btn-side btn-vol-down"></div>
    <div class="btn-side btn-power"></div>

    <div class="phone-shell">
      <div class="phone-bezel">

        <!-- Status bar -->
        <div class="phone-status">
          <div class="dynamic-island"></div>
          <span class="status-time">9:41</span>
          <div class="status-icons">
            <!-- Signal -->
            <svg width="17" height="12" viewBox="0 0 17 12"><rect x="0" y="8" width="3" height="4" rx="0.5"/><rect x="4.5" y="5.5" width="3" height="6.5" rx="0.5"/><rect x="9" y="3" width="3" height="9" rx="0.5"/><rect x="13.5" y="0" width="3" height="12" rx="0.5"/></svg>
            <!-- Wifi -->
            <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 9.5a1.5 1.5 0 110 3 1.5 1.5 0 010-3zm0-3.5a5.5 5.5 0 014.24 2L14 6.24A8 8 0 008 4a8 8 0 00-6 2.24L3.76 8A5.5 5.5 0 018 6zm0-4a9.5 9.5 0 017.07 3.15L16.5 3.7A11.5 11.5 0 008 0 11.5 11.5 0 00-.5 3.7l1.43 1.45A9.5 9.5 0 018 2z" fill-rule="evenodd"/></svg>
            <!-- Battery -->
            <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0" y="1" width="21" height="10" rx="2.5" stroke="white" stroke-width="1" fill="none"/><rect x="1.5" y="2.5" width="16" height="7" rx="1.5" fill="white"/><path d="M22.5 4v4a2 2 0 000-4z" fill="white" opacity="0.4"/></svg>
          </div>
        </div>

        <!-- Page iframe -->
        <iframe
          class="phone-screen"
          src="index.html"
          title="Aperçu Silencio"
          scrolling="yes"
        ></iframe>

        <!-- Home bar -->
        <div class="home-bar">
          <div class="home-indicator"></div>
        </div>

      </div>
    </div>
  </div>

  <div class="hint">Faites défiler dans le téléphone pour voir toute la page</div>
  <div class="gold-line"></div>

</body>
</html>
